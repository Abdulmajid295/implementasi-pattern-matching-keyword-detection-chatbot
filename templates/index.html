<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chatbot FAQ Kampus</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet"
>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.chat-container{
    width:100%;
    max-width:850px;
    height:90vh;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
}

.chat-header{
    background:linear-gradient(90deg,#4f46e5,#6366f1);
    color:white;
    padding:25px;
    text-align:center;
}

.chat-header h2{
    margin-bottom:5px;
    font-weight:bold;
}

.chat-header p{
    font-size:14px;
    opacity:0.9;
}

.chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
    background:#f8fafc;
}

.message{
    margin-bottom:18px;
    display:flex;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
    align-items:flex-start;
    gap:10px;
}

.bubble{
    max-width:75%;
    padding:14px 18px;
    border-radius:18px;
    word-wrap:break-word;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.user .bubble{
    background:#4f46e5;
    color:white;
    border-bottom-right-radius:5px;
}

.bot .bubble{
    background:white;
    border:1px solid #e5e7eb;
    color:#333;
    border-bottom-left-radius:5px;
}

.chat-input{
    display:flex;
    padding:18px;
    background:white;
    border-top:1px solid #eee;
}

.chat-input input{
    flex:1;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.chat-input button{
    margin-left:10px;
    padding:12px 22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    font-weight:600;
}

.send-btn{
    background:#4f46e5;
    color:white;
}

.send-btn:hover{
    background:#3730a3;
}

.clear-btn{
    background:#ef4444;
    color:white;
}

.clear-btn:hover{
    background:#dc2626;
}

.welcome{
    text-align:center;
    color:#666;
    margin-top:30px;
}

.avatar{
    width:40px;
    height:40px;
    background:#4f46e5;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    flex-shrink:0;
}

.timestamp{
    font-size:11px;
    color:#888;
    margin-top:5px;
    text-align:right;
}
</style>

</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <h2>🎓 Chatbot FAQ Kampus</h2>
        <p>Tanyakan seputar KRS, UKT, Skripsi, Akademik, dan Cuti Kuliah</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="welcome">
            Selamat datang 👋<br>
            Silakan ketik pertanyaan Anda.
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="message"
            class="form-control"
            placeholder="Ketik pertanyaan..."
            onkeypress="handleEnter(event)"
        >

        <button
            class="send-btn"
            onclick="sendMessage()"
        >
            Kirim
        </button>

        <button
            class="clear-btn"
            onclick="clearChat()"
        >
            Clear
        </button>

    </div>

</div>

<script>

function addMessage(message, sender) {

    const chatBox = document.getElementById("chatBox");

    const now = new Date();

    const time =
        now.getHours().toString().padStart(2, "0") + ":" +
        now.getMinutes().toString().padStart(2, "0");

    if (sender === "bot") {

        chatBox.innerHTML += `
            <div class="message bot">
                <div class="avatar">🤖</div>

                <div>
                    <div class="bubble">${message}</div>
                    <div class="timestamp">${time}</div>
                </div>
            </div>
        `;

    } else {

        chatBox.innerHTML += `
            <div class="message user">
    <div class="bubble">
        ${message}
        <div class="timestamp">${time}</div>
    </div>
</div>
        `;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const input = document.getElementById("message");
    const message = input.value.trim();

    if (message === "") return;

    addMessage(message, "user");

    input.value = "";

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        addMessage(data.response, "bot");

    } catch (error) {

        addMessage("Terjadi kesalahan pada server.", "bot");

    }
}

function handleEnter(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

function clearChat() {

    const chatBox = document.getElementById("chatBox");

    chatBox.innerHTML = "";

    addMessage(
        "Halo! Saya chatbot FAQ kampus.<br>Silakan ajukan pertanyaan Anda.",
        "bot"
    );
}

window.onload = function() {

    document.querySelector(".welcome").remove();

    addMessage(
        "Halo! Saya chatbot FAQ kampus.<br>Silakan ajukan pertanyaan Anda.",
        "bot"
    );

};

</script>

</body>
</html>
