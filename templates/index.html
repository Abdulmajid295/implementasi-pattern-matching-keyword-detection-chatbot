<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot FAQ Kampus</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background: linear-gradient(135deg,#667eea,#764ba2);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.chat-container{
    width:90%;
    max-width:800px;
    height:85vh;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
}

.chat-header{
    background:#4f46e5;
    color:white;
    padding:20px;
    text-align:center;
}

.chat-header h2{
    margin-bottom:5px;
}

.chat-header p{
    font-size:14px;
    opacity:0.9;
}

.chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
    background:#f5f7fb;
}

.message{
    margin-bottom:15px;
    display:flex;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:75%;
    padding:12px 16px;
    border-radius:15px;
    word-wrap:break-word;
}

.user .bubble{
    background:#4f46e5;
    color:white;
    border-bottom-right-radius:5px;
}

.bot .bubble{
    background:white;
    border:1px solid #ddd;
    color:#333;
    border-bottom-left-radius:5px;
}

.chat-input{
    display:flex;
    padding:15px;
    background:white;
    border-top:1px solid #eee;
}

.chat-input input{
    flex:1;
    padding:12px 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.chat-input button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.chat-input button:hover{
    background:#3730a3;
}

.welcome{
    text-align:center;
    color:#666;
    margin-top:30px;
}
.avatar{
    width:35px;
    height:35px;
    background:#4f46e5;
    color:white;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-right:8px;
    font-size:18px;
    flex-shrink:0;
}

.bot{
    display:flex;
    align-items:flex-start;
    gap:8px;
}
</style>

</head>
<body>

<div class="chat-container">

    <div class="chat-header">
        <h2>🎓 Chatbot FAQ Kampus</h2>
        <p>Tanyakan seputar KRS, UKT, Skripsi, Akademik, dan Cuti Kuliah</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="welcome">
            Selamat datang 👋<br>
            Silakan ketik pertanyaan Anda.
        </div>

    </div>

    <div class="chat-input">
        <input
            type="text"
            id="message"
            placeholder="Ketik pertanyaan..."
            onkeypress="handleEnter(event)"
        >
        <button onclick="sendMessage()">Kirim</button>
    </div>

</div>

<script>

function addMessage(message, sender) {

    const chatBox = document.getElementById("chatBox");

    if (sender === "bot") {

        chatBox.innerHTML += `
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble">${message}</div>
            </div>
        `;

    } else {

        chatBox.innerHTML += `
            <div class="message user">
                <div class="bubble">${message}</div>
            </div>
        `;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const input = document.getElementById("message");
    const message = input.value.trim();

    if (message === "") return;

    addMessage(message, "user");

    input.value = "";

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        addMessage(data.response, "bot");

    } catch (error) {

        addMessage("Terjadi kesalahan pada server.", "bot");

    }
}

function handleEnter(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

window.onload = function() {

    document.querySelector(".welcome").remove();

    addMessage(
        "Halo! Saya chatbot FAQ kampus.<br>Silakan ajukan pertanyaan Anda.",
        "bot"
    );

};

</script>

</body>
</html>
